<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Get to Know Each Other</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container py-5">
    <div class="card bg-secondary text-light shadow">
        <div class="card-body p-4">

            <h1 class="text-center text-info mb-4">
                Let's Get to Know Each Other
            </h1>

            <form>
                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name">
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <!-- University -->
                <div class="mb-3">
                    <label class="form-label">University / Workplace</label>
                    <input type="text" class="form-control">
                </div>

                <!-- Profession -->
                <div class="mb-3">
                    <label class="form-label">What do you do?</label>
                    <select class="form-select">
                        <option>Student</option>
                        <option>Developer</option>
                        <option>Designer</option>
                        <option>Teacher</option>
                        <option>Other</option>
                    </select>
                </div>

                <!-- Interests -->
                <div class="mb-3">
                    <label class="form-label">Interests</label>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">Programming</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">Competitive Programming</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">Web Development</label>
                    </div>
                </div>

                <!-- Message -->
                <div class="mb-3">
                    <label class="form-label">Tell me about yourself</label>
                    <textarea class="form-control" rows="5"></textarea>
                </div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-info">
                    Submit
                </button>

                <a href="index.html" class="btn btn-outline-light ms-2">
                    Back
                </a>
            </form>

        </div>
    </div>
</div>

</body>
</html>
